name: Update Docker Hub Description
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/dockerhub_description.yml

jobs:
  call-dockerhub-action:
    uses: NelsonDane/Custom-GitHub-Actions/.github/workflows/dockerhub-description.yml@7e095d077342808e4f52deb091fcba86f688fe6b
    with:
      dockerhub_repo_name: ${{ github.event.repository.name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
