name: Docker Build and Push

on:
  push:
    branches:
        - main
    paths:
        - main.go
        - Dockerfile
        - go.mod
        - go.sum
        - .github/workflows/docker_build_push.yaml

jobs:
  call-workflow-dockerhub-build-push:
    uses: NelsonDane/Custom-GitHub-Actions/.github/workflows/docker-registry-build-push.yml@7e095d077342808e4f52deb091fcba86f688fe6b
    with:
        image_name: ${{ github.event.repository.name }}
        image_tag: "latest"
        should_push: ${{ github.ref_name == 'main' }}
        platforms: linux/amd64,linux/arm64
    secrets:
        DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
